<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Kết Quả</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            font-weight: bold;
        }

        #resultsContainer {
            border: 1px solid #ccc;
            padding: 15px;
            background: #fff;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .result-section {
            border: 1px solid #aaa;
            padding: 15px;
            border-radius: 6px;
            background-color: #fafafa;
        }

        .section-title {
            font-size: 1.4em;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        .result-row {
            border-bottom: 1px dashed #eee;
            padding: 8px 0;
            font-size: 1.2em;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div id="resultsContainer">Đang tải...</div>

    <script>
        var SUPABASE_URL = "https://rsvggeknetiacezwvgxy.supabase.co";
        var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdmdnZWtuZXRpYWNlend2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0OTI0NzksImV4cCI6MjA4MDA2ODQ3OX0.mkrHJaOA2axmVx8o5M0AOoyiVdmIFyNdQMiQahSvdEU";
        var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const roomCode = params.get('roomid');
        const resultsContainer = document.getElementById('resultsContainer');

        let answers = [];
        let roomStartTime = null;
        let roomCorrectAnswer = null; // Biến lưu trữ đáp án đúng của phòng
        let allParticipants = [];

        // Hàm hỗ trợ kiểm tra xem một giá trị role/name có thuộc nhóm quản lý không
        function isContestantRole(roleStr, nameStr) {
            const r = roleStr ? roleStr.toString().trim().toLowerCase() : "";
            const n = nameStr ? nameStr.toString().trim().toLowerCase() : "";

            // Nếu tên chứa các từ khóa Host, Quản lý, System thì loại bỏ ngay
            if (n === "host" || n.includes("quản lý") || n.includes("quan ly") || n === "system" || n.startsWith("sync_")) {
                return false;
            }

            // Chỉ chấp nhận các tài khoản có role là contestant hoặc thí sinh
            return r === "contestant" || r === "thí sinh" || r === "thisinh";
        }

        async function fetchParticipants() {
            if (!roomCode) return;
            const { data } = await supabase
                .from('participants')
                .select('name, created_at, position, role')
                .eq('room_code', roomCode)
                .order('created_at', { ascending: true });

            if (data) {
                const uniqueParticipantsMap = new Map();
                data.forEach(p => {
                    // Áp dụng bộ lọc chuẩn hóa chữ thường để lọc chính xác thí sinh
                    if (isContestantRole(p.role, p.name)) {
                        const trimmedName = p.name.trim();
                        if (!uniqueParticipantsMap.has(trimmedName)) {
                            uniqueParticipantsMap.set(trimmedName, {
                                name: trimmedName,
                                created_at: p.created_at,
                                position: p.position,
                                role: p.role
                            });
                        }
                    }
                });
                allParticipants = Array.from(uniqueParticipantsMap.values());
            }
        }

        async function fetchRoomInfo() {
            if (!roomCode) return;
            // Lấy thêm trường correct_answer để kiểm tra tính đúng/sai của câu trả lời
            const { data: room, error } = await supabase.from('rooms').select('answer_open_time, correct_answer').eq('room_code', roomCode).single();
            if (room) {
                roomStartTime = room.answer_open_time ? new Date(room.answer_open_time).getTime() : 0;
                roomCorrectAnswer = room.correct_answer ? room.correct_answer.toString().trim().toUpperCase() : null;
            }
        }

        async function fetchAndRender() {
            if (!roomCode) return;
            const { data, error } = await supabase
                .from('answers')
                .select('*')
                .eq('room_code', roomCode);

            answers = data || [];
            render();
        }

        function render() {
            resultsContainer.innerHTML = '';

            const latestAnswersMap = new Map();
            answers.forEach(item => {
                const trimmedName = item.name ? item.name.trim() : "";
                if (!trimmedName) return;

                // Kiểm tra đồng bộ chéo: nếu một cái tên trong bảng answers vô tình trùng với bộ lọc loại trừ, ta cũng bỏ qua
                const lowerName = trimmedName.toLowerCase();
                if (lowerName === "host" || lowerName.includes("quản lý") || lowerName.includes("quan ly") || lowerName === "system") return;

                const existing = latestAnswersMap.get(trimmedName);
                if (!existing || new Date(item.created_at) > new Date(existing.created_at)) {
                    latestAnswersMap.set(trimmedName, item);
                }
            });

            let displayData = Array.from(latestAnswersMap.values());

            const answeredNames = new Set(displayData.map(item => item.name.trim()));
            allParticipants.forEach(p => {
                if (!answeredNames.has(p.name)) {
                    displayData.push({
                        name: p.name,
                        answer_text: null,
                        answer: null,
                        created_at: null
                    });
                }
            });

            // Sắp xếp danh sách theo Tên thí sinh (A-Z)
            // Sắp xếp danh sách theo Tên thí sinh (A-Z) kèm theo xử lý số chính xác
            displayData.sort((a, b) => a.name.localeCompare(b.name, 'vi', { sensitivity: 'base', numeric: true }));

            // Tạo cụm 1: Tên|Đáp án
            const answerSection = document.createElement('div');
            answerSection.className = 'result-section';
            const answerTitle = document.createElement('div');
            answerTitle.className = 'section-title';
            answerTitle.textContent = '';
            answerSection.appendChild(answerTitle);

            // Tạo cụm 2: Tên|Thời gian
            const timeSection = document.createElement('div');
            timeSection.className = 'result-section';
            const timeTitle = document.createElement('div');
            timeTitle.className = 'section-title';
            timeTitle.textContent = '';
            timeSection.appendChild(timeTitle);

            displayData.forEach(item => {
                const answerText = (item.answer_text || item.answer || "").toString().trim().toUpperCase();

                // Logic xác định xem thí sinh có làm đúng hay không
                let isCorrect = false;
                if (roomCorrectAnswer && answerText) {
                    isCorrect = (answerText === roomCorrectAnswer);
                }

                // Tính toán thời gian ban đầu
                let timeStr = '0.00';
                if (item.created_at !== null) {
                    const submitTime = new Date(item.created_at).getTime();
                    let diff = 0;
                    if (roomStartTime && submitTime > roomStartTime) {
                        diff = (submitTime - roomStartTime) / 1000;
                    }

                    // Nếu có thời gian nộp hợp lệ, tiến hành kiểm tra điều kiện đáp án
                    if (roomStartTime && diff > 0) {
                        // SỬA LỖI TẠI ĐÂY: Nếu làm đúng thì lấy số giây thực tế, nếu làm sai quy đổi thẳng về 0.00
                        timeStr = isCorrect ? diff.toFixed(2) : '0.00';
                    } else {
                        timeStr = '0.00';
                    }
                }

                // Render hàng dữ liệu cho cụm Đáp án
                const rowAnswer = document.createElement('div');
                rowAnswer.className = 'result-row';
                rowAnswer.textContent = `${item.name}|${answerText}`;
                answerSection.appendChild(rowAnswer);

                // Render hàng dữ liệu cho cụm Thời gian
                const rowTime = document.createElement('div');
                rowTime.className = 'result-row';
                rowTime.textContent = `${item.name}|${timeStr}`;
                timeSection.appendChild(rowTime);
            });

            resultsContainer.appendChild(answerSection);
            resultsContainer.appendChild(timeSection);
        }

        async function init() {
            if (!roomCode) {
                resultsContainer.innerHTML = "Thiếu <b>?roomid=XXXXXX</b> trên URL";
                return;
            }

            await fetchRoomInfo();
            await fetchParticipants();
            await fetchAndRender();

            supabase.channel('answers_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'answers', filter: `room_code=eq.${roomCode}` },
                    () => {
                        fetchAndRender();
                    })
                .subscribe();

            supabase.channel('room_channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `room_code=eq.${roomCode}` },
                    (payload) => {
                        // Lắng nghe cập nhật của phòng bao gồm cả sự thay đổi của đáp án đúng mới
                        if ('answer_open_time' in payload.new || 'correct_answer' in payload.new) {
                            roomStartTime = payload.new.answer_open_time ? new Date(payload.new.answer_open_time).getTime() : 0;
                            roomCorrectAnswer = payload.new.correct_answer ? payload.new.correct_answer.toString().trim().toUpperCase() : null;
                            fetchAndRender();
                        }
                    })
                .subscribe();

            supabase.channel('participants_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'participants', filter: `room_code=eq.${roomCode}` },
                    () => {
                        fetchParticipants().then(render);
                    })
                .subscribe();
        }

        init();

        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });
    </script>
</body>

</html>
