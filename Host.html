<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>FFF Host Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    input,
    button,
    textarea {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
    }

    table,
    th,
    td {
      border: 1px solid #aaa;
      border-collapse: collapse;
      padding: 8px;
      margin: 10px auto;
    }

    table {
      width: 90%;
      background: #fff;
    }

    #tblAnswers th {
      background: yellow;
      color: black;
      font-weight: bold;
    }

    #tblAnswers td {
      font-weight: bold;
      color: black;
      background: #fff;
    }

    /* Các class tô màu theo luật mới */
    .correct-row td {
      background: blue !important;
      color: white !important;
      font-weight: bold !important;
    }

    .fastest-row td {
      background: red !important;
      color: white !important;
      font-weight: bold !important;
    }

    #roomInfo {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    button {
      cursor: pointer;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      transition: all 0.25s ease;
    }

    .top-buttons-group button {
      height: 40px;
      padding: 0 15px;
    }

    #btnCreate { background: yellow; color: black; }
    #btnJoinManager { background: green; color: white; }
    #btnListUsers { background: blue; color: white; }
    #btnExportResults { background: purple; color: white; }
    #btnManualAdd { background: red; color: white; }
    #unlockAnswersLimited { background: purple; color: white; }
    #unlockAnswersPermanent { background: blue; color: white; }
    #lockAnswers { background: green; color: white; }
    #resetAnswers { background: yellow; color: black; }
    #btnSetCorrect { background: purple; color: white; font-weight: bold; margin-bottom: 10px; }

    button:hover {
      background: #ff00cc !important;
      color: white !important;
    }

    .status-box {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 6px;
      margin: 5px;
      min-width: 160px;
      font-weight: bold;
      font-size: 17px;
    }

    .open { background: green; color: white; box-shadow: 0 0 10px green; }
    .locked { background: red; color: white; }

    #popupMessage {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: blue;
      color: white;
      padding: 15px 30px;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s, top 0.5s;
      font-weight: bold;
      pointer-events: none;
    }

    .error { background-color: red; color: white; }

    .control-group {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .control-item { display: flex; align-items: center; }
    .control-item label { font-weight: bold; margin-right: 10px; }
    .time-elapsed-display { font-size: 1.2em; font-weight: bold !important; margin-top: 10px; height: 25px; color: black; }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1001;
    }

    .popup-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 600px;
      text-align: center;
      max-height: 80vh;
      overflow-y: auto;
    }

    .popup-content h3 { margin-top: 0; }
    .add-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; justify-content: center; }
    .add-row input { width: 150px; font-weight: bold; color: black; }
    #addRowsContainer { margin-top: 10px; border-top: 1px solid #ccc; padding-top: 10px; }
    #userListContainer { max-height: 400px; overflow-y: auto; text-align: left; border: 1px solid #ccc; padding: 10px; margin-top: 15px; }
    #userListContainer ul { list-style: none; padding: 0; }
    #userListContainer li { padding: 5px 0; border-bottom: 1px dotted #eee; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>

<body>
  <h1>FFF Host Panel</h1>
  <div id="roomInfo"></div>
  <div class="top-buttons-group">
    <button id="btnCreate">Tạo phòng</button>
    <button id="btnJoinManager">Tham gia phòng (Quản lý)</button>
    <button id="btnListUsers">Danh sách tham gia</button>
    <button id="btnManualAdd">Bổ sung đáp án</button>
    <button id="btnContestants" style="background: red; color: white;">Nhập danh sách thí sinh</button>
    <button id="btnExportResults">Xuất kết quả</button>
  </div>
  <br><br>

  <div>
    <div class="status-box locked" id="statusAnswer">Đáp án: 🔒 Đang khóa</div>
  </div>

  <div class="time-elapsed-display" id="answerTimeElapsed"></div>

  <div class="control-group">
    <div class="control-item">
      <label for="answerDuration">Thời gian mở đáp án (giây):</label>
      <input type="number" id="answerDuration" value="30" min="1" max="300" style="width: 80px; font-weight: bold;">
    </div>
  </div>

  <div style="margin-top: 5px;">
    <button id="unlockAnswersLimited">Mở đáp án (Giới hạn)</button>
    <button id="unlockAnswersPermanent">Mở đáp án (Vĩnh viễn)</button>
    <button id="lockAnswers">Khóa đáp án</button>
    <button id="resetAnswers">Reset đáp án</button>
  </div>
  <br>

  <h2>Bảng kết quả đáp án:</h2>
  <div style="margin-bottom: 10px; font-weight: bold; color: black; display: flex; justify-content: center; gap: 30px;">
    <label style="cursor: pointer;"><input type="radio" name="sortOption" value="join" onchange="renderAnswers()"> Theo thứ tự danh sách</label>
    <label style="cursor: pointer;"><input type="radio" name="sortOption" value="time" checked onchange="renderAnswers()"> Theo thời gian</label>
  </div>

  <button id="btnSetCorrect">Nhập đáp án đúng</button>

  <table id="tblAnswers">
    <thead>
      <tr>
        <th style="width: 40%;">Tên</th>
        <th style="width: 40%;">Đáp án</th>
        <th style="width: 20%;">Thời gian</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="popupMessage"></div>

  <div id="correctPopup" class="popup-overlay">
    <div class="popup-content">
      <h3>Nhập đáp án đúng</h3>
      <input type="text" id="correctAnswerInput" placeholder="Nhập đáp án..." style="width: 80%; font-weight: bold;">
      <div class="popup-buttons" style="margin-top: 15px;">
        <button id="btnSaveCorrect" style="background: green; color: white; font-weight: bold;">Lưu</button>
        <button id="btnCloseCorrect" style="background: red; color: white; font-weight: bold;">Đóng</button>
      </div>
    </div>
  </div>

  <div id="joinPopup" class="popup-overlay">
    <div class="popup-content">
      <h3>Tham gia phòng (Quản lý)</h3>
      <input type="text" id="managerRoomCode" placeholder="Mã phòng">
      <input type="text" id="managerName" placeholder="Tên quản lý">
      <div class="popup-buttons">
        <button id="btnConfirmManager" style="background:green; color:white;">Xác nhận</button>
        <button id="btnCloseJoin" style="background:red; color:white;">Đóng</button>
      </div>
    </div>
  </div>

  <div id="listPopup" class="popup-overlay">
    <div class="popup-content">
      <h3>Danh sách tham gia</h3>
      <div id="userListContainer">
        <ul></ul>
      </div>
      <button id="btnCloseList" style="background: red; color: white;">Đóng</button>
    </div>
  </div>

  <div id="addPopup" class="popup-overlay">
    <div class="popup-content">
      <h3>Bổ sung đáp án</h3>
      <div class="control-item" style="justify-content: center;">
        <label>Số thí sinh:</label>
        <input type="number" id="numAddRows" value="1" min="1" max="20" style="width: 60px;">
        <button onclick="generateAddRows()" style="background: purple; color: white;">Tạo ô</button>
      </div>
      <div id="addRowsContainer"></div>
      <div class="popup-buttons">
        <button id="btnConfirmAdd" style="background: green; color: white;">Xác nhận</button>
        <button id="btnCloseAdd" style="background: red; color: white;">Đóng</button>
      </div>
    </div>
  </div>

  <div id="contestantsPopup" class="popup-overlay">
    <div class="popup-content">
      <h3>Nhập danh sách thí sinh dự kiến</h3>
      <div class="control-item" style="justify-content: center; margin-bottom: 15px;">
        <label for="numContestants">Số lượng thí sinh (tối đa 100):</label>
        <input type="number" id="numContestants" value="1" min="1" max="100" style="width: 80px;">
      </div>
      <div id="contestantsContainer" style="max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 15px;"></div>
      <div class="popup-buttons">
        <button id="btnSaveContestants" style="background: green; color: white; font-weight: bold;">Lưu & Đồng bộ Cloud</button>
        <button id="btnCloseContestants" style="background: red; color: white; font-weight: bold;">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = "https://rsvggeknetiacezwvgxy.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdmdnZWtuZXRpYWNlend2Z3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0OTI0NzksImV4cCI6MjA4MDA2ODQ3OX0.mkrHJaOA2axmVx8o5M0AOoyiVdmIFyNdQMiQahSvdEU";
    var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRoom = null, myName = "Host", myRole = "host";
    let answers = [], allParticipants = [];
    let lockedAnswer = true, answerStartTime = 0, answerEndTime = 0, serverTimeOffset = 0, roomInfoData = null;
    let lastAnswerResetAt = null;
    let currentCorrectAnswer = "";

    function showPopup(msg, type = "success") {
      const p = document.getElementById("popupMessage");
      p.innerText = msg; p.className = type === "error" ? "error" : "";
      p.style.opacity = 1; p.style.top = "20px";
      setTimeout(() => { p.style.opacity = 0; p.style.top = "-50px"; }, 3000);
    }

    async function syncServerTime() {
      if (!currentRoom) return;
      const { data } = await supabase.from('participants').insert([{ room_code: currentRoom, name: "SYNC_" + Math.random(), role: 'contestant' }]).select().single();
      if (data) { serverTimeOffset = new Date(data.created_at).getTime() - Date.now(); await supabase.from('participants').delete().eq('id', data.id); }
    }

    function updateUI() {
      const sA = document.getElementById("statusAnswer");
      if (!sA || !roomInfoData) return;
      const now = Date.now() + serverTimeOffset;
      const dur = roomInfoData.answer_duration || 0;
      answerEndTime = roomInfoData.answer_open_time ? new Date(roomInfoData.answer_open_time).getTime() + dur * 1000 : 0;
      lockedAnswer = (roomInfoData.answer_status === 'locked') || (answerEndTime > 0 && now >= answerEndTime);
      if (roomInfoData.answer_status === 'open' && (dur === 0 || now < answerEndTime)) {
        sA.className = "status-box open"; sA.innerText = "Đáp án: 🔓 Đang mở";
      } else {
        sA.className = "status-box locked"; sA.innerText = "Đáp án: 🔒 Đang khóa";
      }
    }

    setInterval(() => {
      const now = Date.now() + serverTimeOffset;
      const aDisp = document.getElementById("answerTimeElapsed");
      if (roomInfoData?.answer_status === 'open') {
        if (answerEndTime > 0) {
          let rem = answerEndTime - now;
          if (rem <= 0) { aDisp.innerText = "Hết giờ!"; if (!lockedAnswer) { lockedAnswer = true; updateUI(); } }
          else aDisp.innerHTML = `Thời gian còn lại: <span style="color:red;">${(rem / 1000).toFixed(3)}s</span>`;
        } else aDisp.innerText = "Đang mở (Vĩnh viễn)";
      } else aDisp.innerText = "";
    }, 30);

    function renderAnswers() {
      const body = document.querySelector("#tblAnswers tbody");
      body.innerHTML = "";
      const sort = document.querySelector('input[name="sortOption"]:checked').value;
      
      // Lấy danh sách thí sinh dự kiến thực tế từ danh sách participants (role là contestant và bỏ SYNC_)
      const expectedContestants = allParticipants.filter(p => p.role === 'contestant' && !p.name.startsWith("SYNC_"));
      const uniqueExpectedNames = [...new Set(expectedContestants.map(c => c.name))];

      // Map đáp án mới nhất của từng người dựa trên mảng answers nhận từ server
      const latestAnswersMap = new Map();
      answers.forEach(item => {
        latestAnswersMap.set(item.name, item);
      });

      // Tạo cấu trúc dữ liệu hiển thị gồm TẤT CẢ thí sinh
      let finalRowsData = uniqueExpectedNames.map(cName => {
        const hasAns = latestAnswersMap.get(cName);
        if (hasAns) {
          let originalTime = (new Date(hasAns.created_at).getTime() - answerStartTime) / 1000;
          if (originalTime < 0) originalTime = 0;
          
          let displayTime = originalTime;
          let isCorrect = false;

          if (currentCorrectAnswer) {
            isCorrect = (hasAns.answer_text.trim().toLowerCase() === currentCorrectAnswer.trim().toLowerCase());
            if (!isCorrect) displayTime = 0; // Sai -> Ép về 0.00
          }

          return {
            name: cName,
            answer_text: hasAns.answer_text,
            time: displayTime,
            originalTime: originalTime,
            isCorrect: isCorrect,
            hasResponded: true
          };
        } else {
          // Không trả lời hoặc chưa vào web
          return {
            name: cName,
            answer_text: "",
            time: 0,
            originalTime: Infinity,
            isCorrect: false,
            hasResponded: false
          };
        }
      });

      // Xác định người trả lời đúng và nhanh nhất tuyệt đối
      let fastestCorrectName = null;
      if (currentCorrectAnswer) {
        let correctAnswers = finalRowsData.filter(r => r.isCorrect && r.hasResponded);
        if (correctAnswers.length > 0) {
          correctAnswers.sort((a, b) => a.originalTime - b.originalTime);
          fastestCorrectName = correctAnswers[0].name;
        }
      }

      // Sắp xếp bảng theo cấu hình radio button
      if (sort === "time") {
        finalRowsData.sort((a, b) => {
          if (a.answer_text && !b.answer_text) return -1;
          if (!a.answer_text && b.answer_text) return 1;
          return a.originalTime - b.originalTime;
        });
      }

      finalRowsData.forEach(item => {
        const row = body.insertRow();
        
        // Gắn class CSS tô màu theo luật
        if (currentCorrectAnswer && item.isCorrect) {
          if (item.name === fastestCorrectName) {
            row.className = "fastest-row"; // Đúng + Nhanh nhất -> Màu Đỏ
          } else {
            row.className = "correct-row"; // Đúng bình thường -> Màu Xanh
          }
        }

        row.insertCell().innerText = item.name;
        row.insertCell().innerText = item.answer_text;
        row.insertCell().innerText = item.time.toFixed(2);
      });
    }

    function renderUserListPopup() {
      const ul = document.querySelector("#listPopup ul");
      if (!ul) return;
      ul.innerHTML = "";

      // Bước 1: Đếm số lần xuất hiện của từng tên thí sinh trong bảng participants
      const nameCounts = {};
      allParticipants.forEach(u => {
        if (u.role === "contestant" && !u.name?.startsWith("SYNC_")) {
          nameCounts[u.name] = (nameCounts[u.name] || 0) + 1;
        }
      });

      // Bước 2: Lọc trùng danh sách để hiển thị duy nhất 1 tên
      const uniqueParticipantsMap = new Map();
      allParticipants.forEach(u => {
        if (u.name?.startsWith("SYNC_")) return;
        
        if (!uniqueParticipantsMap.has(u.name)) {
          uniqueParticipantsMap.set(u.name, u);
        } else {
          // Nếu trùng tên, ưu tiên giữ lại bản ghi có thời gian tạo mới hơn (bản ghi vào phòng thực tế)
          const existing = uniqueParticipantsMap.get(u.name);
          if (new Date(u.created_at) > new Date(existing.created_at)) {
            uniqueParticipantsMap.set(u.name, u);
          }
        }
      });
      let displayUsers = Array.from(uniqueParticipantsMap.values());

      // Bước 3: Sắp xếp thứ tự hiển thị chức vụ: Host -> Quản lý -> Thí sinh
      displayUsers.sort((a, b) => {
        const prio = u => {
          if (u.role === "host") return 1;
          if (u.role === "manager") return 2;
          return 3;
        };
        const pA = prio(a);
        const pB = prio(b);
        if (pA !== pB) return pA - pB;
        return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
      });

      // Bước 4: Tiến hành vẽ giao diện HTML dựa trên số lần đếm bản ghi
      displayUsers.forEach(u => {
        const li = document.createElement("li");
        
        if (u.role === "host") {
          li.innerHTML = `<b style="color: green;">${u.name}</b> <span style="color: green; font-weight:bold;">(Host)</span>`;
        } else if (u.role === "manager") {
          li.innerHTML = `<b style="color: blue;">${u.name}</b> <span style="color: blue; font-weight:bold;">(Quản lý)</span>`;
        } else {
          // LOGIC KHÔNG POSITION:
          // Nếu tên thí sinh này xuất hiện từ 2 lần trở lên trong database, 
          // chứng tỏ ngoài danh sách dự kiến ban đầu, họ đã bấm "Vào phòng" thêm 1 lần nữa.
          const hasJoined = nameCounts[u.name] > 1;
          
          const statusText = hasJoined ? "" : " - đã sẵn sàng";
          li.innerHTML = `<b style="color: red;">${u.name}</b> <span style="color: red; font-weight:bold;">(Thí sinh${statusText})</span>`;
        }
        ul.appendChild(li);
      });
    }

    function generateAddRows() {
      const container = document.getElementById("addRowsContainer");
      container.innerHTML = "";
      for (let i = 0; i < document.getElementById("numAddRows").value; i++) {
        container.innerHTML += `<div class="add-row"><input type="text" class="add-name" placeholder="Tên"><input type="text" class="add-answer" placeholder="Đáp án"><input type="number" class="add-time" placeholder="Giây" step="0.01"></div>`;
      }
    }

    async function handleConfirmAdd() {
      const rows = document.querySelectorAll(".add-row");
      const inserts = [];
      for (const row of rows) {
        const name = row.querySelector(".add-name").value.trim();
        const ans = row.querySelector(".add-answer").value.trim();
        const time = parseFloat(row.querySelector(".add-time").value);
        if (name && ans) {
          inserts.push({ room_code: currentRoom, name, answer_text: ans, created_at: new Date(answerStartTime + time * 1000).toISOString() });
        }
      }
      if (inserts.length > 0) await supabase.from('answers').insert(inserts);
      document.getElementById("addPopup").style.display = "none";
    }

    function handleRoomUpdate(room) {
      roomInfoData = room;
      answerStartTime = room.answer_open_time ? new Date(room.answer_open_time).getTime() : 0;
      currentCorrectAnswer = room.correct_answer || "";
      document.getElementById("correctAnswerInput").value = currentCorrectAnswer;

      if (room.answer_reset_at !== lastAnswerResetAt) {
        lastAnswerResetAt = room.answer_reset_at;
        answers = [];
      }
      updateUI();
      renderAnswers();
    }

    function subscribeRealtime() {
      supabase.channel(`room-${currentRoom}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `room_code=eq.${currentRoom}` }, p => handleRoomUpdate(p.new)).subscribe();
      supabase.channel(`answers-${currentRoom}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'answers', filter: `room_code=eq.${currentRoom}` }, p => { answers.push(p.new); renderAnswers(); }).on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'answers', filter: `room_code=eq.${currentRoom}` }, () => { answers = []; renderAnswers(); }).subscribe();
      supabase.channel(`participants-${currentRoom}`).on('postgres_changes', { event: '*', schema: 'public', table: 'participants', filter: `room_code=eq.${currentRoom}` }, () => fetchUsers()).subscribe();
    }

    async function updateRoomStatus(status, duration) {
      const now = new Date(Date.now() + serverTimeOffset).toISOString();
      await supabase.from('rooms').update({ answer_status: status, answer_duration: duration, answer_open_time: status === 'open' ? now : null }).eq('room_code', currentRoom);
    }

    async function fetchUsers() {
      const { data } = await supabase.from('participants').select('*').eq('room_code', currentRoom);
      allParticipants = data || [];
      renderUserListPopup();
      renderAnswers();
    }

    window.onload = () => {
      document.getElementById("btnCreate").onclick = async () => {
        const code = Math.floor(100000 + Math.random() * 900000);
        await supabase.from('rooms').insert([{ room_code: code, answer_status: 'locked', correct_answer: "" }]);
        await supabase.from('participants').insert([{ room_code: code, name: "Host", role: "host" }]);
        currentRoom = code; document.getElementById("roomInfo").innerText = `Phòng: ${code} | Host`;
        syncServerTime(); subscribeRealtime(); fetchUsers();
      };

      document.getElementById("btnConfirmManager").onclick = async () => {
        const code = parseInt(document.getElementById("managerRoomCode").value);
        const name = document.getElementById("managerName").value.trim();
        await supabase.from('participants').insert([{ room_code: code, name, role: "manager" }]);
        currentRoom = code; document.getElementById("roomInfo").innerText = `Phòng: ${code} | Quản lý`;
        document.getElementById("joinPopup").style.display = "none";
        
        // Tự động tải lại và đồng bộ cập nhật trạng thái phòng hiện tại cho Manager vào muộn
        const { data: roomData, error: roomError } = await supabase.from('rooms').select('*').eq('room_code', code).single();
        if (!roomError && roomData) {
          roomInfoData = roomData;
        }
        await syncServerTime(); 
        subscribeRealtime(); 
        await fetchUsers();
      };

      document.getElementById("unlockAnswersLimited").onclick = () => updateRoomStatus('open', parseFloat(document.getElementById("answerDuration").value));
      document.getElementById("unlockAnswersPermanent").onclick = () => updateRoomStatus('open', 0);
      document.getElementById("lockAnswers").onclick = () => updateRoomStatus('locked', 0);
      
      // Khóa và reset toàn bộ bảng đáp án + xoá đáp án đúng ở database cùng lúc
      document.getElementById("resetAnswers").onclick = async () => {
        currentCorrectAnswer = "";
        document.getElementById("correctAnswerInput").value = "";
        await supabase.from('answers').delete().eq('room_code', currentRoom);
        await supabase.from('rooms').update({ 
          answer_reset_at: new Date().toISOString(), 
          answer_status: 'locked', 
          correct_answer: "" 
        }).eq('room_code', currentRoom);
        showPopup("Đã reset đáp án câu cũ & xóa bộ nhớ đáp án đúng!");
      };

      document.getElementById("btnExportResults").onclick = () => {
        if (answers.length === 0) { showPopup("Không có dữ liệu để xuất!", "error"); return; }
        const wb = XLSX.utils.book_new();
        const header = ["Tên", "Đáp án", "Thời gian (s)"];
        const data = [header];

        const expectedContestants = allParticipants.filter(p => p.role === 'contestant' && !p.name.startsWith("SYNC_"));
        const uniqueExpectedNames = [...new Set(expectedContestants.map(c => c.name))];
        const latestAnswersMap = new Map();
        answers.forEach(a => { latestAnswersMap.set(a.name, a); });

        let processedRows = uniqueExpectedNames.map(cName => {
          const hasAns = latestAnswersMap.get(cName);
          if (hasAns) {
            let origTime = (new Date(hasAns.created_at).getTime() - answerStartTime) / 1000;
            if (origTime < 0) origTime = 0;
            let displayTime = origTime;
            let isCorrect = false;
            if (currentCorrectAnswer) {
              isCorrect = (hasAns.answer_text.trim().toLowerCase() === currentCorrectAnswer.trim().toLowerCase());
              if (!isCorrect) displayTime = 0;
            }
            return { name: cName, answer: hasAns.answer_text, time: displayTime, originalTime: origTime, isCorrect: isCorrect };
          } else {
            return { name: cName, answer: "", time: 0, originalTime: Infinity, isCorrect: false };
          }
        });

        let fastestCorrectName = null;
        if (currentCorrectAnswer) {
          let correctAnswers = processedRows.filter(r => r.isCorrect && r.answer);
          if (correctAnswers.length > 0) {
            correctAnswers.sort((a, b) => a.originalTime - b.originalTime);
            fastestCorrectName = correctAnswers[0].name;
          }
        }

        processedRows.forEach(r => {
          data.push([r.name, r.answer, r.time.toFixed(2)]);
        });

        const ws = XLSX.utils.aoa_to_sheet(data);
        const range = XLSX.utils.decode_range(ws["!ref"]);

        for (let R = 1; R <= range.e.r; ++R) {
          const cellNameAddr = XLSX.utils.encode_cell({ r: R, c: 0 });
          if(!ws[cellNameAddr]) continue;
          const currentName = ws[cellNameAddr].v;
          const matchData = processedRows.find(item => item.name === currentName);

          for (let C = 0; C <= range.e.c; ++C) {
            const cellAddr = XLSX.utils.encode_cell({ r: R, c: C });
            if (!ws[cellAddr]) continue;
            if (!ws[cellAddr].s) ws[cellAddr].s = {};
            ws[cellAddr].s.font = { bold: true };

            if (matchData && matchData.isCorrect) {
              if (matchData.name === fastestCorrectName) {
                ws[cellAddr].s.fill = { fgColor: { rgb: "FF0000" } };
                ws[cellAddr].s.font = { bold: true, color: { rgb: "FFFFFF" } };
              } else {
                ws[cellAddr].s.fill = { fgColor: { rgb: "0000FF" } };
                ws[cellAddr].s.font = { bold: true, color: { rgb: "FFFFFF" } };
              }
            }
          }
        }
        XLSX.utils.book_append_sheet(wb, ws, "DapAn");
        XLSX.writeFile(wb, `KetQua_FFF_${currentRoom}.xlsx`);
      };

      document.getElementById("btnJoinManager").onclick = () => document.getElementById("joinPopup").style.display = "flex";
      document.getElementById("btnCloseJoin").onclick = () => document.getElementById("joinPopup").style.display = "none";
      document.getElementById("btnManualAdd").onclick = () => { generateAddRows(); document.getElementById("addPopup").style.display = "flex"; };
      document.getElementById("btnCloseAdd").onclick = () => document.getElementById("addPopup").style.display = "none";
      document.getElementById("btnConfirmAdd").onclick = handleConfirmAdd;
      document.getElementById("btnListUsers").onclick = () => { document.getElementById("listPopup").style.display = "flex"; renderUserListPopup(); };
      document.getElementById("btnCloseList").onclick = () => { document.getElementById("listPopup").style.display = "none"; };

      document.getElementById("btnContestants").onclick = () => {
        document.getElementById("contestantsPopup").style.display = "flex";
        generateContestantRows();
      };
      document.getElementById("btnCloseContestants").onclick = () => { document.getElementById("contestantsPopup").style.display = "none"; };
      document.getElementById("numContestants").addEventListener("input", generateContestantRows);

      function generateContestantRows() {
        const container = document.getElementById("contestantsContainer");
        const numContestants = Math.min(parseInt(document.getElementById("numContestants").value) || 1, 100);
        container.innerHTML = "";
        for (let i = 1; i <= numContestants; i++) {
          const row = document.createElement("div");
          row.className = "add-row";
          row.innerHTML = `
            <span style="width: 40px; font-weight: bold; color: #666;">${i}</span>
            <input type="text" class="contestant-name" placeholder="Nhập tên thí sinh..." style="flex: 1; padding: 8px;">
          `;
          container.appendChild(row);
        }
      }

      document.getElementById("btnSaveContestants").onclick = async () => {
        if (!currentRoom) { showPopup("Bạn cần tạo phòng trước!", "error"); return; }
        const rows = document.querySelectorAll("#contestantsContainer .add-row");
        const inserts = [];
        
        for (const row of rows) {
          const name = row.querySelector(".contestant-name").value.trim();
          if (name) {
            inserts.push({ room_code: currentRoom, name, role: 'contestant', position: 999 });
          }
        }

        if (inserts.length === 0) { showPopup("Vui lòng nhập ít nhất 1 thí sinh!", "error"); return; }

        const { error } = await supabase.from('participants').insert(inserts);
        if(!error) {
          document.getElementById("contestantsPopup").style.display = "none";
          showPopup("Đã đồng bộ danh sách thí sinh lên Cloud!");
          fetchUsers();
        } else {
          showPopup("Lỗi lưu trữ Cloud: " + error.message, "error");
        }
      };

      const btnSetCorrect = document.getElementById("btnSetCorrect");
      const correctPopup = document.getElementById("correctPopup");
      const btnSaveCorrect = document.getElementById("btnSaveCorrect");
      const btnCloseCorrect = document.getElementById("btnCloseCorrect");
      const correctAnswerInput = document.getElementById("correctAnswerInput");

      btnSetCorrect.onclick = () => { correctPopup.style.display = "flex"; correctAnswerInput.focus(); };
      btnCloseCorrect.onclick = () => { correctPopup.style.display = "none"; };
      btnSaveCorrect.onclick = async () => {
        const val = correctAnswerInput.value.trim();
        const { error } = await supabase.from('rooms').update({ correct_answer: val }).eq('room_code', currentRoom);
        if (!error) { correctPopup.style.display = "none"; showPopup("Đã cập nhật đáp án đúng!"); }
        else { showPopup("Lỗi đồng bộ: " + error.message, "error"); }
      };
    };

    document.addEventListener("contextmenu", e => e.preventDefault());
  </script>
</body>

</html>
